name: Automated Testing CI

on:
  push:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Pull Code From GitHub
      uses: actions/checkout@v4

    - name: Set Up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Execute Automated Script Test
      run: python app.py
