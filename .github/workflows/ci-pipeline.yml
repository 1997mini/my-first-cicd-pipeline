name: CI-CD Live Deployment

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Pull Code From GitHub
      uses: actions/checkout@v4

    - name: Set Up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Execute Tests and Build Page
      run: python app.py

    # --- SIMULATED SECURE ENVIRONMENT STEP ---
    - name: Connect to Production Environment
      env:
        # This safely pulls the encrypted password from your repository settings
        SUPER_SECRET_KEY: ${{ secrets.PRODUCTION_API_KEY }}
      run: |
        echo "Attempting secure cloud handshake..."
        echo "Using API key: $SUPER_SECRET_KEY"

    - name: Upload Webpage Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
