name: Java CI with Maven

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Pull the Java code onto the cloud runner
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # Step 2: Set up Java JDK 17 on the cloud runner
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven # Caches dependencies so future runs are faster

    # Step 3: Run the Maven command to compile and test the code
    - name: Build and Test with Maven
      run: mvn clean test
