name: Automated Testing CI

# Trigger the pipeline on every code push to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  run-tests:
    # Spin up a completely fresh, free Ubuntu cloud server
    runs-on: ubuntu-latest

    steps:
    # Step 1: Download your repository code onto the server
    - name: Pull Code From GitHub
      uses: actions/checkout@v4

    # Step 2: Install Python on the cloud server
    - name: Set Up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Step 3: Execute your script to run the internal test function
    - name: Execute Automated Script Test
      run: python app.py
